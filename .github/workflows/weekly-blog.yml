name: Weekly blog post

# Writes ONE new blog post following .claude/blog-playbook.md and opens a Pull
# Request for review. Nothing publishes automatically — merging the PR (after
# checking the Netlify Deploy Preview) is the go-live gate.

on:
  workflow_dispatch: {}          # run manually from the Actions tab any time
  schedule:
    # Tuesdays 12:00 UTC ≈ 8am America/New_York during EDT (7am during EST).
    # GitHub cron has no timezone; change to '0 13 * * 2' if you prefer 8am in winter.
    - cron: '0 12 * * 2'

permissions:
  contents: write         # push the post branch
  pull-requests: write    # open the PR

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cleanly skip (not fail) if the API key hasn't been added yet, so
      # scheduled runs don't send failure emails before setup is complete.
      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set — skipping this run."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Stop if skipping
        if: env.skip == 'true'
        run: exit 0

      # Generate the post. Runs the Claude Code CLI directly (the API key alone
      # authenticates it — no Claude GitHub App required). Claude edits files
      # only; the next step opens the PR. Tools are scoped to file ops (no Bash).
      - name: Write the post with Claude
        if: env.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          npm install -g @anthropic-ai/claude-code
          echo "claude version: $(claude --version || true)"
          claude -p "Follow .claude/blog-playbook.md EXACTLY to publish one new blog post. First read .claude/blog-playbook.md and obey its DO NOT list. In .claude/blog-topics.md, take the top line that has no [done] prefix; if every line is [done], make no changes and stop. Create blog/<slug>.html from the template and make the exact edits the playbook checklist lists: the new post, blog.html (add the card at the top of the grid and bump the article count everywhere it appears), and sitemap.xml (one new <url>); meet every SEO requirement. Then prepend '[done] ' to that topic line in .claude/blog-topics.md. Edit files only. Do NOT run git, commit, push, or deploy." \
            --dangerously-skip-permissions \
            --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Open and auto-merge the pull request
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced (topic queue may be empty) — nothing to publish."
            exit 0
          fi
          slug=$(git status --porcelain -- 'blog/*.html' \
                 | grep -oE 'blog/[a-z0-9-]+\.html' | head -1 \
                 | sed -e 's#blog/##' -e 's#\.html##')
          [ -n "$slug" ] || slug="weekly-$(date +%Y%m%d)"
          branch="blog/$slug"
          git config user.name  "hydrofix-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Add blog post: $slug" \
                     -m "Automated post via the weekly blog pipeline (.claude/blog-playbook.md)." \
                     -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push -u origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "Blog: $slug" \
            --body "$(printf '%s\n' \
              "Automated post following \`.claude/blog-playbook.md\`. Auto-merged by the pipeline; Netlify publishes it to myhydrofix.com on merge." \
              "" \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)")")
          echo "Opened $pr_url"
          # Fully hands-off: merge as soon as GitHub reports it mergeable
          # (no required status checks are configured on this repo).
          for i in 1 2 3 4 5; do
            if gh pr merge "$branch" --merge --delete-branch; then
              echo "Merged and deleted $branch — Netlify will deploy main."; exit 0
            fi
            echo "Merge attempt $i not ready; waiting..."; sleep 10
          done
          echo "::error::PR $pr_url opened but auto-merge did not complete after retries."
          exit 1
