[functions]

  [functions.emails]
  included_files = [
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**",
    "./emails/**"
  ]

[build]
publish = "."

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/img/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

# Retire the stale "active deploy" duplicate tree (a full copy of the site that
# was accidentally published as a subdirectory). Forced 301s consolidate it back
# to the canonical URLs so it stops competing for indexing. The request path is
# percent-encoded (%20), so the encoded form is the one that actually matches;
# the literal-space variants are kept as a fallback.
[[redirects]]
from = "/active%20deploy/*"
to = "/:splat"
status = 301
force = true

[[redirects]]
from = "/active%20deploy"
to = "/"
status = 301
force = true

[[redirects]]
from = "/active deploy/*"
to = "/:splat"
status = 301
force = true

[[redirects]]
from = "/active deploy"
to = "/"
status = 301
force = true

